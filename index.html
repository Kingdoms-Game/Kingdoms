<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This ensures mobile devices scale the page correctly from the very top -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdoms</title>
    <style>
        /* Base PC styles */
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .rules-container {
            font-size: 0.9rem;
            line-height: 1.4;
            max-width: 600px;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Mobile-Specific Overrides (triggers only on screens smaller than 768px) */
        @media (max-width: 768px) {
            body {
                padding: 10px; /* Removes excessive top margin on phones */
                align-items: stretch; /* Allows elements to use full width if needed */
            }

            h1 {
                font-size: 2.2rem; /* Make title bigger and prominent on phone */
                text-align: center;
            }

            .rules-container {
                font-size: 1.15rem; /* Make rules significantly easier to read on mobile */
                line-height: 1.6;
            }

            button {
                padding: 14px 20px; /* Makes submit/action buttons taller for easy thumb tapping */
                font-size: 1.2rem;   /* Larger text inside buttons */
                min-height: 48px;    /* Standard touch-target height */
                margin-top: 8px;
                margin-bottom: 8px;
            }
            
            /* If you have specific input fields or dynamic select boxes for the Ace, scale them up too */
            input, select {
                font-size: 1.1rem;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <h1>Kingdoms</h1>

    <div class="rules-container">
        <p><strong>Quick Rules:</strong> Progress through Jack, Queen, and King phases. Manage your HP scaling, look out for the 2 vs 10 counter-logic, and use the Ace-as-Wild interactive UI to adjust values on the fly.</p>
    </div>

    <!-- Your existing game interface elements go here -->
    <div id="game-container">
        <button id="submit-btn">Submit Move</button>
    </div>

</body>
</html>
