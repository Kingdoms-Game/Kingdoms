<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdoms Card Game</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --danger-color: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: #ffffff;
      --card-text: #0f172a;
      --border-radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 12px;
    }

    /* Outer Wrapper & Layout Hierarchy */
    #game-layout {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    /* Header & Turn Summary */
    header {
      text-align: center;
      padding: 8px;
      background: var(--panel-bg);
      border-radius: var(--border-radius);
    }

    header h1 {
      font-size: 1.4rem;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .turn-indicator {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Player 2 Area (Shifted Up) */
    #p2-area {
      background: var(--panel-bg);
      padding: 12px;
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Card Areas & Scroll Arrows without Boxes */
    .card-strip-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .card-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 6px 2px;
      width: 100%;
      scrollbar-width: none; /* Firefox */
    }

    .card-strip::-webkit-scrollbar {
      display: none; /* Chrome / Safari */
    }

    /* Scroll Arrows: Borderless, extends directly to screen edge */
    .scroll-arrow {
      background: transparent;
      border: none;
      color: var(--accent-color);
      font-size: 1.8rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.2s, transform 0.1s;
    }

    .scroll-arrow:hover {
      color: #7dd3fc;
    }

    .scroll-arrow.left {
      margin-right: 4px;
    }

    .scroll-arrow.right {
      margin-left: 4px;
    }

    /* Cards */
    .card {
      min-width: 54px;
      height: 76px;
      background-color: var(--card-bg);
      color: var(--card-text);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 6px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0;
    }

    .card.red {
      color: #dc2626;
    }

    .card.selected {
      transform: translateY(-8px);
      box-shadow: 0 0 0 3px var(--accent-color);
    }

    .card-value-box {
      font-size: 0.75rem;
      background: #e2e8f0;
      padding: 1px 3px;
      border-radius: 3px;
      text-align: center;
    }

    /* Stats Displays */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Center Playfield / Resolution Area */
    #battlefield {
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed #334155;
      border-radius: var(--border-radius);
      padding: 12px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .royals-box-container {
      display: flex;
      gap: 12px;
    }

    /* Royal Cards Display: J1 Q2 K3 in little boxes, no parentheses */
    .royal-box {
      background: var(--panel-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    /* Player 1 Area */
    #p1-area {
      background: var(--panel-bg);
      padding: 12px;
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Controls & Buttons */
    .controls-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    /* Submit Button with Stacked Text */
    .btn-submit {
      flex: 2;
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: var(--border-radius);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit .main-label {
      font-size: 1rem;
      line-height: 1.1;
    }

    .btn-submit .sub-label {
      font-size: 0.72rem;
      opacity: 0.8;
      margin-top: 3px;
      font-weight: normal;
    }

    /* Forfeit Button */
    .btn-forfeit {
      flex: 1;
      background: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      border-radius: var(--border-radius);
      padding: 10px 14px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .btn-forfeit:hover {
      background: var(--danger-color);
      color: #ffffff;
    }

    #log {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div id="game-layout">
    
    <header>
      <h1>KINGDOMS</h1>
      <div class="turn-indicator" id="turn-indicator">Player 1's Turn (Attack Phase)</div>
    </header>

    <!-- Player 2 Area (Shifted up to occupy freed space) -->
    <div id="p2-area">
      <div class="stats-bar">
        <span>Player 2 (Opponent)</span>
        <span id="p2-hp">HP: 20</span>
      </div>

      <div class="card-strip-container">
        <button class="scroll-arrow left" onclick="scrollStrip('p2-hand', -100)">&#10094;</button>
        <div class="card-strip" id="p2-hand"></div>
        <button class="scroll-arrow right" onclick="scrollStrip('p2-hand', 100)">&#10095;</button>
      </div>
    </div>

    <!-- Battlefield & Royal Cards Display -->
    <div id="battlefield">
      <div class="royals-box-container">
        <div class="royal-box">J1</div>
        <div class="royal-box">Q2</div>
        <div class="royal-box">K3</div>
      </div>
      <div id="log">Select your cards to prepare your move.</div>
    </div>

    <!-- Player 1 Area -->
    <div id="p1-area">
      <div class="stats-bar">
        <span>Player 1 (You)</span>
        <span id="p1-hp">HP: 20</span>
      </div>

      <div class="card-strip-container">
        <button class="scroll-arrow left" onclick="scrollStrip('p1-hand', -100)">&#10094;</button>
        <div class="card-strip" id="p1-hand"></div>
        <button class="scroll-arrow right" onclick="scrollStrip('p1-hand', 100)">&#10095;</button>
      </div>

      <!-- Action Controls -->
      <div class="controls-row">
        <button class="btn-submit" onclick="submitAction()">
          <span class="main-label">Submit Attack / Defense</span>
          <span class="sub-label">Max 10 / 20</span>
        </button>
        <button class="btn-forfeit" onclick="forfeitGame()">Forfeit</button>
      </div>
    </div>

  </div>

  <script>
    // Game State Management
    const gameState = {
      p1HP: 20,
      p2HP: 20,
      p1Hand: [],
      p2Hand: [],
      selectedCards: [],
      currentTurn: 'P1',
      phase: 'Attack'
    };

    const suits = ['♠', '♥', '♦', '♣'];
    const values = [
      { code: 'A', name: 'A', hp: 0 },
      { code: '2', name: '2', hp: 2 },
      { code: '3', name: '3', hp: 3 },
      { code: '4', name: '4', hp: 4 },
      { code: '5', name: '5', hp: 5 },
      { code: '6', name: '6', hp: 6 },
      { code: '7', name: '7', hp: 7 },
      { code: '8', name: '8', hp: 8 },
      { code: '9', name: '9', hp: 9 },
      { code: '10', name: '10', hp: 10 },
      { code: 'J', name: 'J1', hp: 1 },
      { code: 'Q', name: 'Q2', hp: 2 },
      { code: 'K', name: 'K3', hp: 3 }
    ];

    function createDeck() {
      const deck = [];
      for (let s of suits) {
        for (let v of values) {
          deck.push({ suit: s, rank: v.code, label: v.name, isRed: s === '♥' || s === '♦' });
        }
      }
      return deck.sort(() => Math.random() - 0.5);
    }

    let deck = createDeck();

    function initGame() {
      gameState.p1Hand = deck.splice(0, 7);
      gameState.p2Hand = deck.splice(0, 7);
      renderHands();
    }

    function renderHands() {
      const p1Container = document.getElementById('p1-hand');
      const p2Container = document.getElementById('p2-hand');

      p1Container.innerHTML = '';
      p2Container.innerHTML = '';

      gameState.p1Hand.forEach((card, index) => {
        const cardEl = createCardElement(card, index, true);
        p1Container.appendChild(cardEl);
      });

      gameState.p2Hand.forEach((card, index) => {
        const cardEl = createCardElement(card, index, false);
        p2Container.appendChild(cardEl);
      });
    }

    function createCardElement(card, index, isP1) {
      const div = document.createElement('div');
      div.className = `card ${card.isRed ? 'red' : ''}`;
      if (isP1 && gameState.selectedCards.includes(index)) {
        div.classList.add('selected');
      }

      div.innerHTML = `
        <div>${card.rank}${card.suit}</div>
        <div class="card-value-box">${card.label}</div>
      `;

      if (isP1) {
        div.onclick = () => toggleSelectCard(index);
      }
      return div;
    }

    function toggleSelectCard(index) {
      const pos = gameState.selectedCards.indexOf(index);
      if (pos > -1) {
        gameState.selectedCards.splice(pos, 1);
      } else {
        gameState.selectedCards.push(index);
      }
      renderHands();
    }

    function scrollStrip(id, distance) {
      const el = document.getElementById(id);
      el.scrollBy({ left: distance, behavior: 'smooth' });
    }

    function submitAction() {
      const log = document.getElementById('log');
      if (gameState.selectedCards.length === 0) {
        log.innerText = "Please select at least one card to play.";
        return;
      }

      log.innerText = `Played ${gameState.selectedCards.length} card(s). Turn resolved!`;
      
      // Remove played cards
      gameState.p1Hand = gameState.p1Hand.filter((_, idx) => !gameState.selectedCards.includes(idx));
      gameState.selectedCards = [];
      
      // Replenish cards if deck remains
      while (gameState.p1Hand.length < 7 && deck.length > 0) {
        gameState.p1Hand.push(deck.pop());
      }

      renderHands();
    }

    function forfeitGame() {
      const log = document.getElementById('log');
      log.innerText = "Game Over. You forfeited the match.";
    }

    // Initialize game state on load
    initGame();
  </script>
</body>
</html>
